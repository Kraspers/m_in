<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MIN Admin Login</title><link rel='stylesheet' href='/admin.css'></head><body class='admin-bg'>
<div class='login-shell'><div class='login-box'><input id='pass' class='inp' type='password' placeholder='Пароль'><button id='loginBtn' class='btn-primary'>Войти</button><div id='err' class='err'></div></div></div>
<script>async function go(){const p=document.getElementById('pass').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const j=await r.json();if(!r.ok){document.getElementById('err').textContent=j.error||'Ошибка';return;}localStorage.setItem('adminToken',j.token);location.href='/admin-panel';}document.getElementById('loginBtn').onclick=go;document.getElementById('pass').addEventListener('keydown',e=>e.key==='Enter'&&go());</script>
</body></html>
